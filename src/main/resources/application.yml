server:
  port: 8080

spring:
  application:
    name: apache-cxf-spring-boot

cxf:
  path: /services
  servlet:
    init:
      service-list-path: /info

# Logging configuration for SLF4J
logging:
  level:
    root: INFO
    com.example.cxf: DEBUG
    org.apache.cxf: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
      file-name-pattern: logs/application-%d{yyyy-MM-dd}.%i.log
