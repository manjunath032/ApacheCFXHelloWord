version: '3.8'

services:
  # Redis Master
  redis-master:
    image: redis:7-alpine
    container_name: redis-master
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --appendfilename "appendonly.aof"
    volumes:
      - redis-master-data:/data
    networks:
      - redis-sentinel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis Replica 1
  redis-replica-1:
    image: redis:7-alpine
    container_name: redis-replica-1
    ports:
      - "6380:6379"
    command: redis-server --replicaof redis-master 6379 --appendonly yes
    volumes:
      - redis-replica-1-data:/data
    networks:
      - redis-sentinel-network
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis Replica 2
  redis-replica-2:
    image: redis:7-alpine
    container_name: redis-replica-2
    ports:
      - "6381:6379"
    command: redis-server --replicaof redis-master 6379 --appendonly yes
    volumes:
      - redis-replica-2-data:/data
    networks:
      - redis-sentinel-network
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Sentinel 1
  redis-sentinel-1:
    image: redis:7-alpine
    container_name: redis-sentinel-1
    ports:
      - "26379:26379"
    command: >
      sh -c "cp /sentinel-config/sentinel.conf /tmp/sentinel.conf &&
             chmod 666 /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"
    volumes:
      - ./redis-sentinel/sentinel1.conf:/sentinel-config/sentinel.conf:ro
    networks:
      - redis-sentinel-network
    depends_on:
      redis-master:
        condition: service_healthy

  # Sentinel 2
  redis-sentinel-2:
    image: redis:7-alpine
    container_name: redis-sentinel-2
    ports:
      - "26380:26379"
    command: >
      sh -c "cp /sentinel-config/sentinel.conf /tmp/sentinel.conf &&
             chmod 666 /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"
    volumes:
      - ./redis-sentinel/sentinel2.conf:/sentinel-config/sentinel.conf:ro
    networks:
      - redis-sentinel-network
    depends_on:
      redis-master:
        condition: service_healthy

  # Sentinel 3
  redis-sentinel-3:
    image: redis:7-alpine
    container_name: redis-sentinel-3
    ports:
      - "26381:26379"
    command: >
      sh -c "cp /sentinel-config/sentinel.conf /tmp/sentinel.conf &&
             chmod 666 /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"
    volumes:
      - ./redis-sentinel/sentinel3.conf:/sentinel-config/sentinel.conf:ro
    networks:
      - redis-sentinel-network
    depends_on:
      redis-master:
        condition: service_healthy

networks:
  redis-sentinel-network:
    driver: bridge

volumes:
  redis-master-data:
  redis-replica-1-data:
  redis-replica-2-data:
